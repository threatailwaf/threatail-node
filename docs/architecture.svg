<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 522" width="720" role="img"
     aria-label="Request flow: internet, through the Threatail node inspection stages, to your app">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; text-anchor: middle; }
    .t0 { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .t1 { font-size: 13px; fill: #1f2328; }
    .t2 { font-size: 10.5px; fill: #656d76; }
    .t3 { font-size: 12.5px; fill: #1f2328; }
    .t4 { font-size: 10px; fill: #656d76; }
    .box   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
    .cloud { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .stage { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .frame { fill: none;    stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arr   { stroke: #8c959f; stroke-width: 1.4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .t0, .t1, .t3 { fill: #e6edf3; }
      .t2, .t4 { fill: #8b949e; }
      .box   { fill: #161b22; stroke: #30363d; }
      .cloud { fill: #0c2d6b; stroke: #1f6feb; }
      .stage { fill: #0d1117; stroke: #30363d; }
      .frame { stroke: #a371f7; }
      .arr   { stroke: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x='128' y='64' width='404' height='372' rx='12' class='frame'/><text x='150' y='82' class='t0' style='text-anchor:start'>threatail-node</text><rect x='150' y='104' width='360' height='44' rx='7' class='stage'/><text x='330.0' y='120' class='t3'>TLS + decode</text><text x='330.0' y='136' class='t2'>unwrap gzip, brotli, UTF-7, base64</text><line x1='330.0' y1='148' x2='330.0' y2='157' class='arr' marker-end='url(#a)'/><rect x='150' y='158' width='360' height='44' rx='7' class='stage'/><text x='330.0' y='174' class='t3'>Signatures</text><text x='330.0' y='190' class='t2'>SQLi · XSS · traversal · RCE</text><line x1='330.0' y1='202' x2='330.0' y2='211' class='arr' marker-end='url(#a)'/><rect x='150' y='212' width='360' height='44' rx='7' class='stage'/><text x='330.0' y='228' class='t3'>Rules + rate limit</text><text x='330.0' y='244' class='t2'>yours and centrally managed</text><line x1='330.0' y1='256' x2='330.0' y2='265' class='arr' marker-end='url(#a)'/><rect x='150' y='266' width='360' height='44' rx='7' class='stage'/><text x='330.0' y='282' class='t3'>Bot + anomaly</text><text x='330.0' y='298' class='t2'>verified crawlers · per-site profile</text><line x1='330.0' y1='310' x2='330.0' y2='319' class='arr' marker-end='url(#a)'/><rect x='150' y='320' width='360' height='44' rx='7' class='stage'/><text x='330.0' y='336' class='t3'>ML model</text><text x='330.0' y='352' class='t2'>trained on your labelled traffic</text><line x1='330.0' y1='364' x2='330.0' y2='373' class='arr' marker-end='url(#a)'/><rect x='150' y='374' width='360' height='44' rx='7' class='stage'/><text x='330.0' y='390' class='t3'>Threat score</text><text x='330.0' y='406' class='t2'>one number, one threshold</text><rect x='260.0' y='8' width='140' height='42' rx='9' class='box'/><text x='330.0' y='24' class='t1'>Internet</text><text x='330.0' y='40' class='t2'>ports 80 / 443</text><line x1='330.0' y1='50' x2='330.0' y2='96' class='arr' marker-end='url(#a)'/><line x1='330.0' y1='430' x2='330.0' y2='458' class='arr' marker-end='url(#a)'/><text x='396.0' y='448' class='t4'>clean traffic only</text><rect x='260.0' y='462' width='140' height='44' rx='9' class='box'/><text x='330.0' y='479' class='t1'>Your app</text><text x='330.0' y='495' class='t2'>never exposed</text><rect x='562' y='254' width='118' height='52' rx='9' class='cloud'/><text x='621' y='273' class='t1'>threatail-cloud</text><text x='621' y='289' class='t2'>config · model</text><line x1='560' y1='280' x2='518' y2='280' class='arr' marker-end='url(#a)'/><text x='621' y='246' class='t4'>outbound only</text>
</svg>